version: 2
updates:
  # npm dependencies (root package). create-taqwright/ has no lockfile, so it is
  # not watched. Major bumps arrive as individual PRs; minor/patch are grouped
  # (dev vs prod) to avoid PR spam.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native (Go) compiler. typescript-eslint, which the
      # lint step depends on, only accepts typescript <6.1, so a 7.x bump fails
      # npm ci before lint or tests run (see #98). Lift this once
      # typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  # Keep the GitHub Actions (checkout, setup-node, codeql-action, …) current.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
